name: corpus
on:
  pull_request:
    paths: ["corpus/**"]
  push:
    paths: ["corpus/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest==9.1.1
      - run: python -m pytest corpus/tests -q
