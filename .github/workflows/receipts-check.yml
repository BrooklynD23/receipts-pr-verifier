name: Receipts check

# Trigger is `pull_request` only. The privileged "_target" variant runs with
# a write token and secrets in the base repo context, so checking out and
# running untrusted PR code there is a known privilege-escalation path. With
# `pull_request`, fork PRs get a read-only token and the check degrades to a
# job summary instead of a PR comment.
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check receipts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/check-pr.ts --base "$BASE_SHA" --head "$HEAD_SHA"
