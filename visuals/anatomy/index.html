<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receipts — proof of checking</title>
    <style>
      .iso {
        --anatomy-page: #0b0b0b;
        --anatomy-card: #131313;
        --anatomy-text: #a3a3a3;
        --anatomy-strong: #e6e6e6;
        --anatomy-muted: #6e6e6e;
        --anatomy-paper: #131313;
        --anatomy-face: #1b1b1b;
        --anatomy-top: #1c1c1c;
        --anatomy-shade-0: #0f0f0f;
        --anatomy-shade-1: #121212;
        --anatomy-shade-2: #151515;
        --anatomy-shade-3: #181818;
        --anatomy-lit-top: #262626;
        --anatomy-lit-shade: #1d1d1d;
        --anatomy-hi: #d4d4d4;
        --anatomy-mid: #6a6a6a;
        --anatomy-lo: #3e3e3e;
        --anatomy-faint: #2a2a2a;
        --anatomy-lit: #ffffff;
        --anatomy-halo: #050505;
        --anatomy-halo-opacity: 0.9;
        --anatomy-dot: #e6e6e6;
        --anatomy-red: #ff6b6b;
        --anatomy-green: #6be0a0;
        --anatomy-blue: #6b9bff;
        --anatomy-weight: 0.6px;
        --anatomy-ease: cubic-bezier(0.32, 0.72, 0, 1);
        --anatomy-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --anatomy-lift:
          inset 0 1px 0 0 #ffffff0a, inset 0 0 0 1px #ffffff06,
          0 0 0 1px #00000026, 0 1px 1px -0.5px #00000014,
          0 3px 3px -1.5px #00000014, 0 6px 6px -3px #00000014,
          0 12px 12px -6px #00000014;
      }
      .iso[data-theme="light"] {
        --anatomy-page: #f2f2ef;
        --anatomy-card: #fbfbfa;
        --anatomy-text: #57575a;
        --anatomy-strong: #18181a;
        --anatomy-muted: #8c8c90;
        --anatomy-paper: #fbfbfa;
        --anatomy-face: #ffffff;
        --anatomy-top: #ffffff;
        --anatomy-shade-0: #dcdcd9;
        --anatomy-shade-1: #e5e5e2;
        --anatomy-shade-2: #ededea;
        --anatomy-shade-3: #f4f4f1;
        --anatomy-lit-top: #ffffff;
        --anatomy-lit-shade: #eeeeeb;
        --anatomy-hi: #26262a;
        --anatomy-mid: #8a8a8f;
        --anatomy-lo: #b4b4b8;
        --anatomy-faint: #d4d4d6;
        --anatomy-lit: #000000;
        --anatomy-halo: #8a8a80;
        --anatomy-halo-opacity: 0.32;
        --anatomy-dot: #3a3a3e;
        --anatomy-red: #e5484d;
        --anatomy-green: #30a46c;
        --anatomy-blue: #3e63dd;
        --anatomy-lift:
          inset 0 1px 0 0 #ffffff, 0 0 0 1px #0000000f,
          0 1px 1px -0.5px #0000000a, 0 3px 3px -1.5px #0000000a,
          0 6px 6px -3px #0000000a, 0 12px 12px -6px #0000000a;
      }
      .iso-svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .iso-svg path,
      .iso-svg circle {
        vector-effect: non-scaling-stroke;
      }
      .iso-fill {
        fill: var(--anatomy-paper);
        stroke: none;
      }
      .iso-solid[data-lit] > .iso-fill {
        fill: var(--anatomy-face);
      }
      .iso-shade,
      .iso-top {
        stroke: none;
      }
      .iso-shade[data-shade="0"] {
        fill: var(--anatomy-shade-0);
      }
      .iso-shade[data-shade="1"] {
        fill: var(--anatomy-shade-1);
      }
      .iso-shade[data-shade="2"] {
        fill: var(--anatomy-shade-2);
      }
      .iso-shade[data-shade="3"] {
        fill: var(--anatomy-shade-3);
      }
      .iso-top {
        fill: var(--anatomy-top);
      }
      .iso-solid[data-lit] > .iso-top {
        fill: var(--anatomy-lit-top);
      }
      .iso-solid[data-lit] > .iso-shade {
        fill: var(--anatomy-lit-shade);
      }
      .iso-solid[data-seamless] > .iso-shade,
      .iso-solid[data-seamless] > .iso-top {
        stroke-width: 0.4;
        stroke-linejoin: round;
      }
      .iso-solid[data-seamless] > .iso-shade[data-shade="0"] {
        stroke: var(--anatomy-shade-0);
      }
      .iso-solid[data-seamless] > .iso-shade[data-shade="1"] {
        stroke: var(--anatomy-shade-1);
      }
      .iso-solid[data-seamless] > .iso-shade[data-shade="2"] {
        stroke: var(--anatomy-shade-2);
      }
      .iso-solid[data-seamless] > .iso-shade[data-shade="3"] {
        stroke: var(--anatomy-shade-3);
      }
      .iso-solid[data-seamless] > .iso-top {
        stroke: var(--anatomy-top);
      }
      .iso-solid[data-seamless][data-lit] > .iso-top {
        stroke: var(--anatomy-lit-top);
      }
      .iso-solid[data-seamless][data-lit] > .iso-shade {
        stroke: var(--anatomy-lit-shade);
      }
      .iso-solid[data-lit] > .iso-edge {
        stroke: var(--anatomy-lit);
      }
      .iso-halo {
        fill: var(--anatomy-halo);
        stroke: none;
        filter: blur(9px);
        opacity: var(--anatomy-halo-opacity);
        transform: translateY(3px);
      }
      .iso-line {
        fill: none;
        stroke: var(--anatomy-lo);
        stroke-width: var(--anatomy-weight);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .iso-line[data-tone="hi"] {
        stroke: var(--anatomy-hi);
      }
      .iso-line[data-tone="mid"] {
        stroke: var(--anatomy-mid);
      }
      .iso-line[data-tone="lo"] {
        stroke: var(--anatomy-lo);
      }
      .iso-line[data-tone="faint"] {
        stroke: var(--anatomy-faint);
      }
      .iso-line[data-tone="lit"] {
        stroke: var(--anatomy-lit);
      }
      .iso-line[data-tone="red"] {
        stroke: var(--anatomy-red);
      }
      .iso-line[data-tone="green"] {
        stroke: var(--anatomy-green);
      }
      .iso-line[data-tone="blue"] {
        stroke: var(--anatomy-blue);
      }
      .iso-line[data-dotted] {
        stroke-dasharray: 0.01 3.5;
        stroke-width: 1;
      }
      .iso-line[data-dashed] {
        stroke-dasharray: 3 3;
      }
      .iso-line[data-flow] {
        stroke-dasharray: 2 6;
      }
      .iso-wire-end {
        fill: var(--anatomy-paper);
        stroke: var(--anatomy-lo);
        stroke-width: var(--anatomy-weight);
      }
      .iso-wire[data-tone="hi"] .iso-wire-end {
        stroke: var(--anatomy-hi);
      }
      .iso-wire[data-tone="mid"] .iso-wire-end {
        stroke: var(--anatomy-mid);
      }
      .iso-wire[data-tone="faint"] .iso-wire-end {
        stroke: var(--anatomy-faint);
      }
      .iso-wire[data-tone="lit"] .iso-wire-end {
        stroke: var(--anatomy-lit);
      }
      .iso-dots circle {
        fill: var(--anatomy-dot);
        stroke: none;
        opacity: 0.32;
      }
      .iso-dots[data-tone="hi"] circle {
        opacity: 0.85;
      }
      .iso-dots[data-tone="mid"] circle {
        opacity: 0.45;
      }
      .iso-dots[data-tone="lo"] circle {
        opacity: 0.22;
      }
      .iso-dots[data-tone="faint"] circle {
        opacity: 0.12;
      }
      .iso-face-text {
        fill: var(--anatomy-mid);
        font-family: var(--anatomy-mono);
        letter-spacing: 0.04em;
      }
      .iso-face-text[data-tone="hi"] {
        fill: var(--anatomy-hi);
      }
      .iso-face-text[data-tone="lo"] {
        fill: var(--anatomy-lo);
      }
      .iso-face-text[data-tone="faint"] {
        fill: var(--anatomy-faint);
      }
      .tb-body {
        fill: var(--anatomy-shade-2);
        stroke: none;
      }
      .tb-shine {
        fill: var(--anatomy-top);
        stroke: none;
      }
      .tb-shade {
        fill: var(--anatomy-shade-0);
        stroke: none;
      }
      .tb-ring {
        fill: none;
        stroke: var(--anatomy-lo);
        stroke-width: 0.45;
        stroke-linecap: butt;
        stroke-linejoin: round;
      }
      .tb-ring[data-tone="mid"] {
        stroke: var(--anatomy-mid);
      }
      .tb-ring[data-tone="faint"] {
        stroke: var(--anatomy-faint);
      }
      .tb-ring[data-tone="hi"] {
        stroke: var(--anatomy-hi);
      }
      @keyframes iso-flow {
        to {
          stroke-dashoffset: -32;
        }
      }
      @keyframes iso-pulse {
        0%,
        100% {
          opacity: 0.18;
        }
        12% {
          opacity: 1;
        }
        40% {
          opacity: 0.18;
        }
      }
      .iso-line[data-flow] {
        animation: iso-flow 1600ms linear infinite;
      }
      .iso-dots circle[data-pulse] {
        animation: iso-pulse 1600ms steps(1, end) infinite;
        animation-delay: var(--pulse-at, 0ms);
      }
      .iso-figure {
        margin: 32px 0 36px;
      }
      .iso-plate {
        position: relative;
        padding: 52px 24px;
        border-radius: 0;
        background: var(--anatomy-card);
        box-shadow: 0 0 0 1px var(--anatomy-mid);
        --anatomy-paper: var(--anatomy-card);
      }
      .iso-plate-corners {
        position: absolute;
        inset: 18px 20px;
        pointer-events: none;
      }
      .iso-plate-corner {
        position: absolute;
        color: var(--anatomy-muted);
        font-family: var(--anatomy-mono);
        font-size: 10.5px;
        line-height: 1;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .iso-plate-corner[data-corner="fig"] {
        top: 0;
        left: 0;
        color: var(--anatomy-text);
      }
      .iso-plate-corner[data-corner="title"] {
        top: 0;
        right: 0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .iso-plate-corner[data-corner="hint"] {
        bottom: 0;
        left: 0;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .iso-plate-corner[data-corner="readout"] {
        right: 0;
        bottom: 0;
        color: var(--anatomy-text);
        font-variant-numeric: tabular-nums;
      }
      .iso-plate .iso-svg {
        margin: 0 auto;
      }
      .iso-legend {
        display: grid;
        gap: 8px;
        margin-top: 12px;
        color: var(--anatomy-muted);
        font-size: 13px;
        line-height: 1.55;
      }
      .iso-keys {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
      }
      .iso-key {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .iso-swatch {
        width: 16px;
        height: 10px;
        flex: none;
        overflow: visible;
      }
      .iso-swatch path {
        fill: none;
        stroke: var(--anatomy-hi);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .iso-swatch[data-mark="raised"] path,
      .iso-swatch[data-mark="flat"] path {
        stroke: var(--anatomy-mid);
      }
      .iso-swatch[data-mark="lit"] path {
        stroke: var(--anatomy-lit);
      }
      .iso-swatch[data-mark="dim"] path {
        stroke: var(--anatomy-lo);
      }
      .iso-swatch[data-mark="dotted"] path {
        stroke-dasharray: 0.01 3;
        stroke-width: 1.4;
      }
      .iso-swatch[data-mark="dashed"] path {
        stroke-dasharray: 3 2.5;
      }
      .iso-swatch[data-mark="red"] path {
        stroke: var(--anatomy-red);
      }
      .iso-swatch[data-mark="green"] path {
        stroke: var(--anatomy-green);
      }
      .iso-swatch[data-mark="blue"] path {
        stroke: var(--anatomy-blue);
      }
      .iso-swatch-crease {
        stroke: var(--anatomy-lo) !important;
      }
      @media (max-width: 560px) {
        .iso-plate {
          padding: 48px 12px 70px;
        }
        .iso-plate-corner[data-corner="hint"] {
          bottom: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .iso-line[data-flow],
        .iso-dots circle[data-pulse] {
          animation: none;
        }
      }

      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
      }
      body[data-theme="light"] {
        color-scheme: light;
      }
      body {
        margin: 0;
        background: var(--anatomy-page);
        color: var(--anatomy-text);
        font:
          14px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .iso-page {
        width: min(700px, 100% - 32px);
        margin: 64px auto 96px;
      }
    </style>
  </head>

          );
        flagF.setAttribute("d", fq(4));
        flagTip.setAttribute(
          "d",
          pathOf(
            [
              [fp[0], ...ry(-4.6)],
              [fp[0] + 4, ...ry(-4.6)],
              [fp[0] + 4, ...ry(-6.5)],
              [fp[0], ...ry(-6.5)],
            ].map(pt),
            true,
          ),
        );
        flagO.setAttribute(
          "d",
          pathOf(
            [
              [fp[0], ...ry(0)],
              [fp[0] + 4, ...ry(0)],
              [fp[0] + 4, ...ry(-6.5)],
              [fp[0], ...ry(-6.5)],
            ].map(pt),
            true,
          ),
        );
        // feed crank: arm + knob tilting in the x-z plane about (94,46,7.4)
        const ca = deg(M.crank);
        const cv = (dx, dz) => [
          94 + dx * Math.cos(ca) + dz * Math.sin(ca),
          7.4 - dx * Math.sin(ca) + dz * Math.cos(ca),
        ];
        const cy0 = 44.5,
          cy1 = 47.5;
        crankArm.setAttribute(
          "d",
          pathOf(
            [cv(0, 0.6), cv(13, 0.6), cv(13, 0.6), cv(0, 0.6)].map((p, i) =>
              pt([p[0], i === 0 || i === 3 ? cy0 : cy0, 0]),
            ),
            true,
          ),
        );
        const armTop = [
          pt([cv(0, 0.6)[0], cy0, cv(0, 0.6)[1]]),
          pt([cv(13, 0.6)[0], cy0, cv(13, 0.6)[1]]),
          pt([cv(13, 0.6)[0], cy1, cv(13, 0.6)[1]]),
          pt([cv(0, 0.6)[0], cy1, cv(0, 0.6)[1]]),
        ];
        const armEdge = [
          pt([cv(0, 0.6)[0], cy1, cv(0, 0.6)[1]]),
          pt([cv(13, 0.6)[0], cy1, cv(13, 0.6)[1]]),
          pt([cv(13, -0.6)[0], cy1, cv(13, -0.6)[1]]),
          pt([cv(0, -0.6)[0], cy1, cv(0, -0.6)[1]]),
        ];
        crankArm.setAttribute("d", pathOf(armTop, true));
        crankEdge.setAttribute("d", pathOf(armEdge, true));
        crankArmO.setAttribute("d", pathOf(armTop, true));
        const kp = cv(14.2, 0),
          knob = cylinder(kp[0], 46, 2.2, kp[1] - 1.2, 2.4, P, 20);
        crankKnob[0].setAttribute("d", knob.fill);
        crankKnob[1].setAttribute("d", knob.shades[1] + knob.shades[2]);
        crankKnob[2].setAttribute("d", knob.top);
        crankKnob[3].setAttribute("d", knob.outline);
        lampEls.forEach((g, i) => {
          const bulb = g.querySelector("[data-bulb]"),
            ring = g.querySelector(".iso-line");
          const isTrip = g.dataset.lamp === "trip";
          let on = false,
            col = "";
          if (isTrip) {
            on = M.tripped;
            col = "var(--anatomy-red)";
          } else if (M.tripped && i === M.tripLamp) {
            on = true;
            col = "var(--anatomy-red)";
          } else {
            on = M.lamps[i] > 0.5;
            col = "var(--anatomy-green)";
          }
          ring.setAttribute("data-tone", on ? "hi" : "lo");
          bulb.style.fill = on ? col : "var(--anatomy-faint)";
        });
        const rowsIn = ROWX.filter((x) => M.head >= x + M.slip.x).length;
        const lit = M.lamps.filter((v) => v > 0.5).length;
        let text = "ready · Space feeds a slip";
        if (M.phase === "feedIn") text = "feeding " + M.kind + " slip";
        else if (M.phase === "scan")
          text = "line " + Math.min(rowsIn, 9) + "/9 · checks " + lit + "/6";
        else if (M.phase === "advance") text = "to the stamp · 6/6";
        else if (M.phase === "stamp")
          text = M.stamped
            ? "stamped · receipt #" + M.stamps
            : "6/6 · stamping";
        else if (M.phase === "exit") text = "accepted → tray";
        else if (M.phase === "tripped") text = "trip at line 5/9 · ejecting";
        else if (M.phase === "reset")
          text = M.tripped ? "rejected · resetting" : "reset";
        if (readout.textContent !== text) readout.textContent = text;
        stage.setAttribute(
          "aria-valuenow",
          String(
            Math.round(((M.head - HEAD_MIN) / (HEAD_MAX - HEAD_MIN)) * 100),
          ),
        );
        stage.setAttribute("aria-valuetext", text);
      }

      const follow = (cur, tgt, dt, tau, calm) =>
        calm ? tgt : cur + (tgt - cur) * (1 - Math.exp(-dt / tau));
      const smooth = (a, b, x) => {
        const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };

      let frame = 0,
        last = 0,
        visible = false,
        touring = !still.matches,
        idleTimer = 0;
      function enter(phase) {
        M.phase = phase;
        M.t = 0;
        if (phase === "feedIn") {
          M.kind = M.fed % 2 ? "sabot" : "clean";
          M.fed++;
          Object.assign(M.slip, {
            x: HOME.x,
            y: HOME.y,
            z: HOME.z,
            pitch: 0,
            tilt: 0,
          });
          Object.assign(M.target, {
            x: SCANP.x,
            y: SCANP.y,
            z: SCANP.z,
            pitch: 0,
            tilt: 0,
          });
          M.lamps = [0, 0, 0, 0, 0, 0];
          M.tripped = false;
          M.stamped = false;
          M.markOn = false;
          M.flag = 0;
          M.ej = 0;
          M.ram = 0;
          M.crank = 28;
        }
        if (phase === "tripped") {
          M.tripped = true;
          M.tripLamp = M.lamps.findIndex((v) => v < 0.5);
          if (M.tripLamp < 0) M.tripLamp = 5;
        }
      }
      function tick(now) {
        const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
        last = now;
        M.t += dt;
        const calm = still.matches;
        const s = M.slip,
          tg = M.target;
        s.x = follow(s.x, tg.x, dt, 0.3, calm);
        s.y = follow(s.y, tg.y, dt, 0.2, calm);
        s.z = follow(s.z, tg.z, dt, 0.2, calm);
        s.pitch = follow(s.pitch, tg.pitch, dt, 0.18, calm);
        s.tilt = follow(s.tilt, tg.tilt, dt, 0.18, calm);
        M.head = follow(M.head, M.headTarget, dt, 0.13, calm);
        M.crank = follow(M.crank, -6, dt, 0.5, calm);
        M.flag = follow(M.flag, M.tripped ? 1 : 0, dt, 0.08, calm);
        M.pin = follow(
          M.pin,
          M.lamps.every((v) => v > 0.5) ? 1 : 0,
          dt,
          0.18,
          calm,
        );
        if (touring || M.phase !== "idle") {
          switch (M.phase) {
            case "idle":
              if (touring && M.t > 1.4) enter("feedIn");
              break;
            case "feedIn":
              if (Math.abs(s.x - SCANP.x) < 0.7) {
                s.x = SCANP.x;
                enter("scan");
              }
              break;
            case "scan":
              if (touring)
                M.headTarget = Math.min(
                  HEAD_MAX,
                  HEAD_MIN + (M.t / 2.8) * (HEAD_MAX - HEAD_MIN),
                );
              if (M.kind === "sabot" && M.head >= TRIP_X) {
                enter("tripped");
                break;
              }
              if (
                M.head >= HEAD_MAX - 0.3 &&
                M.headTarget >= HEAD_MAX - 0.5 &&
                M.lamps.every((v) => v > 0.5)
              )
                enter(M.kind === "clean" ? "advance" : "tripped");
              break;
            case "advance":
              Object.assign(M.target, {
                x: STAMPP.x,
                y: STAMPP.y,
                z: STAMPP.z,
                pitch: 0,
                tilt: 0,
              });
              if (Math.abs(s.x - STAMPP.x) < 0.8) enter("stamp");
              break;
            case "stamp": {
              M.ram = smooth(0, 0.28, M.t) * (1 - smooth(0.62, 1.05, M.t));
              if (M.t > 0.26 && !M.stamped) {
                M.stamped = true;
                M.markOn = true;
                M.stamps++;
                tapeState.rows = Math.min(M.stamps, 5);
                tapeState.len = Math.min(30, tapeState.len + 6);
                drawTape();
              }
              if (M.t > 1.15) enter("exit");
              break;
            }
            case "exit":
              Object.assign(M.target, {
                x: OUTP.x,
                y: OUTP.y,
                z: OUTP.z,
                tilt: -7,
              });
              if (Math.abs(s.x - OUTP.x) < 0.9) {
                M.target.tilt = 0;
                if (Math.abs(s.tilt) < 0.4) enter("reset");
              }
              break;
            case "tripped":
              M.ej = smooth(0.5, 1.0, M.t);
              if (M.t > 0.5)
                Object.assign(M.target, {
                  x: BINP.x,
                  y: BINP.y,
                  z: BINP.z,
                  pitch: -8,
                  tilt: 0,
                });
              else if (M.t > 0.2) M.target.y = 10;
              if (M.t > 1.7) enter("reset");
              break;
            case "reset": {
              M.headTarget = HEAD_MIN;
              if (M.t > 0.4) M.ej = 0;
              const dim = Math.floor(M.t / 0.08);
              for (let i = 0; i < 6; i++) if (i < dim) M.lamps[i] = 0;
              if (M.t > 1.0) {
                M.tripped = false;
                enter("idle");
              }
              break;
            }
          }
        }
        LAMP_X.forEach((lx, i) => {
          if (!M.tripped && M.phase === "scan" && M.head >= lx) M.lamps[i] = 1;
        });
        draw();
        const moving =
          M.phase !== "idle" ||
          touring ||
          Math.abs(M.head - M.headTarget) > 0.02 ||
          Math.abs(M.crank + 6) > 0.02 ||
          Math.abs(M.flag - (M.tripped ? 1 : 0)) > 0.02;
        frame = visible && moving ? requestAnimationFrame(tick) : 0;
      }
      const run = () => {
        if (!frame && visible) {
          last = 0;
          frame = requestAnimationFrame(tick);
        }
      };
      const steer = (fn) => {
        touring = false;
        fn();
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          if (!still.matches) touring = true;
        }, 3600);
        run();
      };
      const feedNext = () => {
        if (M.phase === "idle" || M.phase === "reset") enter("feedIn");
      };
      new IntersectionObserver(
        (es) => {
          visible = es[es.length - 1].isIntersecting;
          if (visible) run();
        },
        { rootMargin: "120px 0px" },
      ).observe(stage);
      if (still.matches) touring = false;
      stage.addEventListener("pointermove", (e) => {
        if (M.phase !== "scan") return;
        const box = svg.getBoundingClientRect();
        const share = Math.max(
          0,
          Math.min(1, (e.clientX - box.left) / box.width),
        );
        steer(() => {
          M.headTarget = HEAD_MIN + share * (HEAD_MAX - HEAD_MIN);
        });
      });
      stage.addEventListener("pointerdown", () => steer(feedNext));
      stage.addEventListener("keydown", (e) => {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          steer(feedNext);
          return;
        }
        if (M.phase !== "scan") return;
        let next = null;
        if (e.key === "ArrowRight") next = M.headTarget + 4;
        if (e.key === "ArrowLeft") next = M.headTarget - 4;
        if (e.key === "Home") next = HEAD_MIN;
        if (e.key === "End") next = HEAD_MAX;
        if (next === null) return;
        e.preventDefault();
        steer(() => {
          M.headTarget = Math.max(HEAD_MIN, Math.min(HEAD_MAX, next));
        });
      });
      draw();
      drawTape();
    </script>
  </body>
</html>
